# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: mopeds

theme:
  name: material
  custom_dir: overrides
  features:
    - content.action.edit
    - navigation.sections
    - navigation.expand

nav:

  - Home: index.md
  - Tutorials:
      - Simulation NLE: Simulation NLE.ipynb
      - Parameter Estimation NLE: Parameter Estimation NLE.ipynb
      - OED NLE: Optimal Experimental Design NLE.ipynb
      - Simulation DAE: Simulation DAE.ipynb
      - PE DAE: Parameter Estimation DAE.ipynb
      - OED DAE: Optimal Experimental Design DAE.ipynb

  - Project:

      - Release Notes: release_notes.md
      - Changelog: changelog.md
      - Contributing: contributing.md
      #- Publications: publications.md

  - API reference:
      - Model: api/model.md
      - Variables: api/variables.md
      - Simulation NLE: api/simulation_nle.md
      - Simulation Dynamic: api/simulation_dynamic.md
      - Optimization: api/optimization.md
      - Optimization OED: api/optimization_oed.md

repo_url: https://git.tu-berlin.de/dbta/optimization/mopeds

edit_uri: edit/main/docs/

markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md

plugins:
  - mkdocs-jupyter:
      ignore: [".ipynb_checkpoints/*.ipynb"]
  - include-markdown
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true

extra_css:
  - stylesheets/extra.css
