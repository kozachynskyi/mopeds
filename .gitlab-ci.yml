stages:
  - test
  - test-manual

.test:
    stage: "test"
    script:
      - pip install .
      - pip install pytest
      - pytest

.test-manual:
    stage: "test-manual"
    script:
      - pip install .
      - pip install pytest
      - pytest
    when: manual

test-3.10:
    extends: ".test-manual"
    tags: 
      - py310
      - linux

