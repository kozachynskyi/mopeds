stages:
  - test
  - test-manual

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  key: "uv-$CI_JOB_NAME"
  paths:
    - .uv-cache/

.python-versions: &python-versions
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14"

.unix-test:
  script:
    - uv python install $PYTHON_VERSION
    - uv venv --python $PYTHON_VERSION
    - uv pip install .
    - uv pip install pytest
    - uv run pytest

.windows-test:
  script:
    - uv python install $env:PYTHON_VERSION
    - uv venv --python $env:PYTHON_VERSION
    - uv pip install .
    - uv pip install pytest
    - uv run pytest

.manual:
  stage: test-manual
  when: manual

.test-macos:
  extends:
    - .unix-test
  stage: test
  tags:
    - macos
    - arm64
    - mopeds

.test-windows:
  extends:
    - .windows-test
  stage: test
  tags:
    - windows
    - mopeds

.test-debian:
  extends:
    - .unix-test
  stage: test
  image: ghcr.io/astral-sh/uv:debian-slim
  before_script:
    - apt-get update
    - apt-get install -y libgfortran5
  tags:
    - debian
    - mopeds

#
# Main automatic test
#

test-macos-3.12:
  extends: .test-macos
  variables:
    PYTHON_VERSION: "3.13"

#
# Manual matrix jobs
#

test-macos:
  extends:
    - .test-macos
    - .manual
  parallel:
    matrix:
      - PYTHON_VERSION: *python-versions

test-debian:
  extends:
    - .test-debian
    - .manual
  parallel:
    matrix:
      - PYTHON_VERSION: *python-versions

test-windows:
  extends:
    - .test-windows
    - .manual
  parallel:
    matrix:
      - PYTHON_VERSION: *python-versions
