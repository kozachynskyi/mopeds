stages:
  - test
  - test-manual

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  key: "uv-$CI_JOB_NAME"
  paths:
    - .uv-cache/

.test-macos:
  stage: test
  variables:
    PYTHON_VERSION: "3.12"
  script:
    - uv python install $PYTHON_VERSION
    - uv venv --python $PYTHON_VERSION
    - uv pip install .
    - uv pip install pytest
    - uv run pytest
  tags:
    - macos
    - arm64
    - mopeds

.test-macos-manual:
  extends: ".test-macos"
  stage: test-manual
  when: manual

.test-windows:
  stage: test
  variables:
    PYTHON_VERSION: "3.12"
  script:
    - uv python install $env:PYTHON_VERSION
    - uv venv --python $env:PYTHON_VERSION
    - uv pip install .
    - uv pip install pytest
    - uv run pytest
  tags:
    - windows
    - mopeds

.test-windows-manual:
  extends: ".test-windows"
  stage: test-manual
  when: manual

.test-debian:
  stage: test
  image: ghcr.io/astral-sh/uv:debian-slim
  before_script:
    - apt-get update
    - apt-get install -y libgfortran5
  script:
    - uv python install $PYTHON_VERSION
    - uv venv --python $PYTHON_VERSION
    - uv pip install .
    - uv pip install pytest
    - uv run pytest
  tags:
    - debian
    - mopeds

.test-debian-manual:
  extends: ".test-debian"
  stage: test-manual
  when: manual

# Main automatic test on your local Mac runner
test-macos-3.12:
