stages:
  - build
  - deploy

.template_linux_podman: &linux-podman
  tags:
    - linux
    - podman
  image: python:3.9-slim-buster

linux-build_parameter-estimation:
  <<: *linux-podman
  stage: build
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
  script:
    - poetry install
    - poetry run pytest

linux-deploy_parameter-estimation:
  <<: *linux-podman
  stage: deploy
  needs: [linux-build_parameter-estimation]
  only:
    - tags
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
  script:
    - poetry install
    - poetry build
    - poetry config repositories.itwm-gitlab https://gitlab.itwm.fraunhofer.de/api/v4/projects/${CI_PROJECT_ID}/packages/pypi
    - poetry publish -r itwm-gitlab -u gitlab-ci-token -p ${CI_JOB_TOKEN}
