[tool.poetry]
name = "par_est"
version = "0.9.3a1"
description = "Simulate and Optimize ODE/DAE"
authors = ["Volodymyr Kozachynskyi <vovakozach@gmail.com>"]
repository = "https://git.tu-berlin.de/vovakozach/pe_oed_casadi"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.8,<=3.12"
casadi = ">=3.6.4"
numpy = ">1.21"
matplotlib = ">3.4.2"
scipy = ">1.8"
pandas = ">1.4"
tqdm = ">=4.64.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2"
pytest-cov = "^2.8"
tox = "^3.0"
mypy = "^0.812"
Sphinx = {version = "^4.4.0", optional = true}
coverage = {extras = ["toml"], version = "^6.1.1"}
myst-parser = {version = "^0.18.0", optional = true}

[tool.poetry.extras]
docs = ["sphinx"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
    ]

[tool.isort]
profile = "black"
multi_line_output = 3
known_first_party = "par_est"
skip = ["src/par_est/__init__.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov par_est --cov-report term-missing --verbose"
testpaths = "tests"
