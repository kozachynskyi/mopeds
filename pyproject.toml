[project]
name = "mopeds"
version = "0.11.0"
description = "Simulate and Optimize (Parameter Estimation, Optimal Experimental Design) NLE, ODE and DAE"
authors = [{ name = "Volodymyr Kozachynskyi", email = "vovakozach@gmail.com" }]
requires-python = ">=3.8,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "casadi (<3.7.0)",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "tqdm",
]

[project.urls]
homepage = "https://mopeds.readthedocs.io/en/latest/"
repository = "https://git.tu-berlin.de/dbta/optimization/mopeds"

[dependency-groups]
test = ["pytest"]
docs = ["notebook"]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
